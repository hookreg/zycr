<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PAPERS // ZYCR</title>

  <link
    rel="stylesheet"
    href="/assets/css/terminal.css"
  >

</head>


<body>

<main class="terminal">


  <div class="topbar">

    <span>
      ZYCR NETWORK // PAPER ARCHIVE
    </span>

    <span class="status">
      ONLINE
    </span>

  </div>


  <section>

    <div class="section-title">
      [ PUBLISHED PAPERS ]
    </div>


    <div class="record">

      <div class="record-id">
        PUB-001
      </div>

      <h2>
        Your First Paper
      </h2>

      <div class="record-meta">
        VENUE: TBD
        ·
        YEAR: TBD
        ·
        STATUS: PUBLISHED
      </div>

      <p>
        这里写论文简介。
      </p>

      <p>
        <a href="#">
          [ PAPER ]
        </a>

        &nbsp;

        <a href="/publications/code/">
          [ CODE ]
        </a>
      </p>

    </div>

  </section>


  <footer>

    <a href="/publications/">
      &lt; RETURN PUBLICATIONS
    </a>

  </footer>


</main>

</body>

</html>
